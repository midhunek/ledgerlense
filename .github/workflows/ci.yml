name: LedgerLens CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Run pytest schema-contract tests
  # -------------------------------------------------------------------------
  test:
    name: Schema Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run schema contract tests
        env:
          OPENAI_API_KEY: "sk-ci-test-key-not-real"
          DATABASE_URL: "sqlite:///:memory:"
          UPLOADS_DIR: "/tmp/test_uploads"
          PROCESSED_DIR: "/tmp/test_processed"
        run: |
          pytest tests/test_schema_contracts.py tests/test_moderation.py -v --tb=short

      - name: Run endpoint tests
        env:
          OPENAI_API_KEY: "sk-ci-test-key-not-real"
          DATABASE_URL: "sqlite:///:memory:"
          UPLOADS_DIR: "/tmp/test_uploads"
          PROCESSED_DIR: "/tmp/test_processed"
        run: |
          pytest tests/test_endpoints.py -v --tb=short

  # -------------------------------------------------------------------------
  # Job 2: Docker build (runs only after tests pass)
  # -------------------------------------------------------------------------
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build -f docker/Dockerfile.backend -t ledgerlens-backend:ci ./backend

      - name: Build frontend image
        run: |
          docker build -f docker/Dockerfile.frontend -t ledgerlens-frontend:ci ./frontend

      - name: Verify images built
        run: |
          docker images | grep ledgerlens

